[project]
name = "zadan3django"
version = "0.1.0"
description = ""
authors = [
    {name = "Владислав Чернявский",email = "cernavskijv877@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "djangorestframework (>=3.17.2,<4.0.0)"
]

[tool.poetry]
packages = [{include = "zadan3django", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
exclude = [".git", "__pycache__"]
line-length = 119
lint.extend-select = ["RUF", "I", "E", "W", "F", "UP", "B", "SIM", "PL", "TCH"]
lint.ignore = ["RUF001"]

[dependency-groups]
dev = [
    "mypy (>=2.3.0,<3.0.0)",
    "django-stubs (>=6.0.8,<7.0.0)"
]
